name: Build SoulFire server with plugins

# The Auto TP Accept plugin cannot be dropped into a running server: SoulFire
# compiles plugins in (see server-plugin/README.md). So the server has to be
# rebuilt, and the resulting jar is ~433 MB — too big to pass around by hand.
#
# This builds it here and leaves it as a downloadable artifact.

on:
  workflow_dispatch:
    inputs:
      soulfire_ref:
        description: "SoulFire tag/branch to build (must match your client version)"
        required: true
        default: "2.9.1"

permissions:
  # contents: write, because the jar is published as a release asset: workflow
  # artifacts expire after a few days and cannot be fetched by a Pterodactyl
  # install script, which needs a stable URL.
  contents: write
  # packages: write, for the Docker image. On the target host the panel caps
  # request bodies (413 on a ~430 MB write) and Wings' remote-pull is broken
  # (DaemonConnectionException on every URL), so baking the jar into an image
  # that the node pulls itself is the only route needing no file transfer.
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this repo (for the plugin source)
        uses: actions/checkout@v6

      - name: Clone SoulFire at ${{ inputs.soulfire_ref }}
        run: |
          git clone --depth=1 --branch "${{ inputs.soulfire_ref }}" \
            https://github.com/soulfiremc-com/SoulFire.git soulfire

      - name: Add the plugins
        run: |
          # ClassGraph finds plugins by annotation within this package, so
          # dropping the file in is the whole installation step.
          cp server-plugin/*.java soulfire/mod/src/main/java/com/soulfiremc/server/plugins/
          ls -1 soulfire/mod/src/main/java/com/soulfiremc/server/plugins/ | grep -F .java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the runnable server jar
        working-directory: soulfire
        # uberJar, not assemble: assemble only produces the unshaded launcher,
        # which is not runnable on its own.
        run: ./gradlew :dedicated-launcher:uberJar --console=plain

      - name: Verify the plugins are actually in the jar
        working-directory: soulfire
        run: |
          JAR="$(ls dedicated-launcher/build/libs/SoulFireDedicated-*.jar | grep -v -- '-unshaded' | grep -v -- '-sources' | grep -v -- '-javadoc')"
          echo "Built $JAR ($(du -h "$JAR" | cut -f1))"
          # The mod is a nested jar inside the uber jar, so the plugin classes
          # are one level down. A jar that builds but ships no plugin is the
          # failure worth catching here.
          unzip -o -q "$JAR" 'META-INF/jars/mod-*.jar' -d nested
          MOD="$(ls nested/META-INF/jars/mod-*.jar)"
          for src in ../server-plugin/*.java; do
            cls="$(basename "$src" .java)"
            if unzip -l "$MOD" | grep -q "com/soulfiremc/server/plugins/$cls.class"; then
              echo "ok: $cls.class present"
            else
              echo "MISSING: $cls.class is not in the built jar"
              exit 1
            fi
          done
          mkdir -p ../out && cp "$JAR" ../out/

      - uses: actions/upload-artifact@v5
        with:
          name: soulfire-server-${{ inputs.soulfire_ref }}-with-plugins
          path: out/*.jar
          # The jar is large and only needed until it is on the host.
          retention-days: 7
          compression-level: 0

      - name: Publish as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="server-${{ inputs.soulfire_ref }}-plugins"
          JAR="$(ls out/*.jar)"

          # A fixed tag that gets overwritten, so the egg's SF_JAR_URL keeps
          # working across rebuilds instead of needing an edit each time.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --title "SoulFire ${{ inputs.soulfire_ref }} with custom plugins" \
              --notes "SoulFire ${{ inputs.soulfire_ref }} built with the plugins in server-plugin/. Point the Pterodactyl egg's SF_JAR_URL at the asset URL below."
          fi

          ASSET_ID="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
            --jq '.assets[] | select(.name | endswith(".jar")) | .id')"

          {
            echo "## Pterodactyl"
            echo
            echo "Set the egg variable \`SF_JAR_URL\` to:"
            echo
            echo '```'
            echo "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET_ID"
            echo '```'
            echo
            echo "While this repository is private, \`SF_GITHUB_TOKEN\` must also be set to a token with read access."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image name
        id: image
        # Docker requires a lowercase repository name and github.repository
        # preserves the owner's capitalisation, so it cannot be used directly.
        # Actions has no lowercase function, hence doing it here.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/soulfire-plugins" >> "$GITHUB_OUTPUT"

      - name: Build and push the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            SF_VERSION=${{ inputs.soulfire_ref }}
          tags: ${{ steps.image.outputs.name }}:${{ inputs.soulfire_ref }}

      - name: Report the image and the one manual step
        run: |
          IMAGE="${{ steps.image.outputs.name }}:${{ inputs.soulfire_ref }}"
          {
            echo "## Docker image"
            echo
            echo '```'
            echo "$IMAGE"
            echo '```'
            echo
            echo "GHCR packages inherit the repository's visibility, and a node cannot pull"
            echo "a private image, so this needs making public once:"
            echo
            echo "Profile -> Packages -> soulfire-plugins -> Package settings -> Change visibility -> Public"
            echo
            echo "Then point the Pterodactyl server at the image above and restart it."
          } >> "$GITHUB_STEP_SUMMARY"

name: Upstream check

# This repo is a hard fork of SoulFireClient by file copy, so there is no
# shared history and nothing tells us when upstream moves. This job asks, on a
# schedule, and files the answer as a single tracking issue.
#
# It deliberately does not push or open a pull request: most upstream commits
# touch files that were modified for mobile, and merging those is a judgement
# call, not something to automate silently.

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The check compares file blobs against the last synced upstream
          # commit, which a shallow checkout does not have.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check upstream
        id: check
        run: |
          node scripts/check-upstream.mjs | tee report.txt
          node scripts/check-upstream.mjs --json > report.json

      - name: Open or update the tracking issue
        if: steps.check.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Upstream sync available"
          body="$(printf 'Upstream SoulFireClient has moved. Run `node scripts/check-upstream.mjs` locally for the current state, and see `UPSTREAM.md` for how to apply it.\n\n```\n%s\n```\n' "$(cat report.txt)")"

          existing="$(gh issue list --state open --label upstream-sync --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
            gh issue comment "$existing" --body "Re-checked: upstream has moved again. Body updated."
          else
            gh label create upstream-sync --color 1d76db --description "Fork is behind upstream SoulFireClient" 2>/dev/null || true
            gh issue create --title "$title" --body "$body" --label upstream-sync
          fi

      - name: Close the tracking issue when back in sync
        if: steps.check.outputs.has_updates == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing="$(gh issue list --state open --label upstream-sync --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Back in sync with upstream." --reason completed
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: upstream-report
          path: |
            report.txt
            report.json
